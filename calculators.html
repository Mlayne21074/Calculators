<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculators</title>
<style>
:root{--bg:#fff;--fg:#111;--card:#f6f6f6;--bd:#999;--accent:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181c;--fg:#eee;--card:#22252b;--bd:#666;--accent:#ff8a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16181c;--fg:#eee;--card:#22252b;--bd:#666;--accent:#ff8a7a;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;margin:0;padding:16px;max-width:720px}
section{background:var(--card);border:1px solid var(--bd);padding:12px 16px;margin-bottom:20px}
h2{margin:0 0 10px;font-size:1.25rem}
input[type=number]{width:60px;padding:3px}
input,select,button{font-size:1rem;background:var(--bg);color:var(--fg);border:1px solid var(--bd)}
button{cursor:pointer;padding:3px 8px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.res{margin-top:10px;font-weight:bold}
.res span{color:var(--accent)}
.opts label{margin-right:10px}
</style>
</head>
<body>

<section>
<h2>Task 1. Calculator with text box and dropdown list</h2>
<div class="row">
  <input type="number" id="num1-1" value="10">
  <select name="operator" id="operator-1">
    <option value="+">+</option>
    <option value="-">-</option>
    <option value="*">*</option>
    <option value="/">/</option>
  </select>
  <input type="number" id="num2-1" value="5">
  <button id="equals-1">=</button>
  <b>Press = mark!</b>
</div>
<div class="res">Result: <span id="result-1">–</span></div>
</section>

<section>
<h2>Task 2. Calculator with text box and option buttons</h2>
<div><input type="number" id="num1-2" value="10" style="width:160px"></div>
<div class="opts">
  <input type="radio" id="+" name="operator-2" value="+" checked><label for="+">Addition</label><br>
  <input type="radio" id="-" name="operator-2" value="-"><label for="-">Subtraction</label><br>
  <input type="radio" id="*" name="operator-2" value="*"><label for="*">Multiplication</label><br>
  <input type="radio" id="/" name="operator-2" value="/"><label for="/">Division</label><br>
</div>
<div class="row">
  <input type="number" id="num2-2" value="5" style="width:160px">
  <button id="equals-2">=</button>
  <b>Press = mark!</b>
</div>
<div class="res">Result: <span id="result-2">–</span></div>
</section>

<section>
<h2>Task 3. Calculator with text box and increment/decrement buttons</h2>
<div class="row">
  <button id="dec1-3">▼</button>
  <input type="number" id="num1-3" value="10">
  <button id="inc1-3">▲</button>
  <select name="operator-3" id="operator-3">
    <option value="+">+</option>
    <option value="-">-</option>
    <option value="*">*</option>
    <option value="/">/</option>
  </select>
  <button id="dec2-3">▼</button>
  <input type="number" id="num2-3" value="10">
  <button id="inc2-3">▲</button>
  <button id="equals-3">=</button>
  <b>Press = mark!</b>
</div>
<div class="res">Result: <span id="result-3">–</span></div>
</section>

<script>
function calc(a, op, b) {
  a = parseFloat(a); b = parseFloat(b);
  if (isNaN(a) || isNaN(b)) return "Please enter two numbers";
  switch (op) {
    case "+": return a + b;
    case "-": return a - b;
    case "*": return a * b;
    case "/": return b === 0 ? "Cannot divide by zero" : a / b;
  }
}
function show(id, v) {
  document.getElementById(id).textContent = (typeof v === "number") ? +v.toFixed(10) : v;
}

// Task 1
document.getElementById("equals-1").addEventListener("click", function () {
  show("result-1", calc(
    document.getElementById("num1-1").value,
    document.getElementById("operator-1").value,
    document.getElementById("num2-1").value));
});

// Task 2
document.getElementById("equals-2").addEventListener("click", function () {
  var op = document.querySelector('input[name="operator-2"]:checked').value;
  show("result-2", calc(
    document.getElementById("num1-2").value, op,
    document.getElementById("num2-2").value));
});

// Task 3
function step(id, d) {
  var el = document.getElementById(id);
  var v = parseFloat(el.value);
  el.value = (isNaN(v) ? 0 : v) + d;
}
document.getElementById("dec1-3").addEventListener("click", function () { step("num1-3", -1); });
document.getElementById("inc1-3").addEventListener("click", function () { step("num1-3", 1); });
document.getElementById("dec2-3").addEventListener("click", function () { step("num2-3", -1); });
document.getElementById("inc2-3").addEventListener("click", function () { step("num2-3", 1); });
document.getElementById("equals-3").addEventListener("click", function () {
  show("result-3", calc(
    document.getElementById("num1-3").value,
    document.getElementById("operator-3").value,
    document.getElementById("num2-3").value));
});
</script>
</body>
</html>
